aid: timescaledb
url: https://raw.githubusercontent.com/api-evangelist/timescaledb/refs/heads/main/apis.yml
name: TimescaleDB / Tiger Data
kind: company
description: >-
  TimescaleDB (now part of Tiger Data) is a PostgreSQL-native time-series database featuring hypertables, columnstore
  (Hypercore), continuous aggregates, retention policies and hyperfunctions. The managed Tiger Cloud platform exposes a
  public REST API for managing projects, services, VPCs, peering and read replicas, while the database itself is
  consumed via standard PostgreSQL wire protocol.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
  - Database
  - Time-Series
  - PostgreSQL
  - Open Source
  - Cloud
  - Hypertables
  - Continuous Aggregates
  - Tiger Cloud
created: '2026-05-08'
modified: '2026-05-19'
specificationVersion: '0.19'
apis:
  - aid: timescaledb:tiger-cloud-rest
    name: Tiger Cloud REST API
    description: >-
      Public REST API for the Tiger Cloud control plane — manage projects, services (PostgreSQL/TimescaleDB instances),
      VPCs, peering, read replicas and analytics events. Authenticated with public/private API key pairs.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.tigerdata.com/docs/reference/tiger-cloud-rest
    baseURL: https://console.cloud.tigerdata.com/public/api/v1
    tags:
      - REST
      - Control Plane
      - Services
      - VPC
      - Replicas
    properties:
      - type: Documentation
        url: https://www.tigerdata.com/docs/reference/tiger-cloud-rest
      - type: OpenAPI
        url: openapi/timescaledb-openapi.yml
      - type: OpenAPISource
        url: https://raw.githubusercontent.com/timescale/tiger-cli/main/openapi.yaml
      - type: SDKs
        url: https://github.com/timescale/tiger-cli
  - aid: timescaledb:postgres-wire
    name: TimescaleDB PostgreSQL Wire Interface
    description: >-
      The database itself is accessed via the PostgreSQL wire protocol (port 5432), with TimescaleDB SQL functions for
      hypertable management, compression, continuous aggregates and hyperfunctions. Not a REST API.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.tigerdata.com/docs/api/latest
    baseURL: postgres://<host>:5432/<db>
    tags:
      - PostgreSQL
      - SQL
      - Wire Protocol
    properties:
      - type: Documentation
        url: https://www.tigerdata.com/docs/api/latest
      - type: SourceCode
        url: https://github.com/timescale/timescaledb
